name: Alarm Clock candidate
on:
  workflow_dispatch:
    inputs:
      verify_digest:
        description: Existing sha256 index digest to verify without rebuilding
        required: false
        default: ""
permissions:
  contents: read
  packages: write
concurrency:
  group: alarmclock-candidate
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ inputs.verify_digest == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DaFern/music-assistant-alarm-clock-server
          ref: f0c825c708fcca577430aac46aa30f8cbf23b79b
          path: companion
          fetch-depth: 0
          persist-credentials: false
      - run: python3 candidate/prepare.py
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: candidate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dafern/music-assistant-alarm-clock-server:2.10.12-alarmclock.2
          provenance: mode=max
          sbom: true
      - name: Inspect published manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/dafern/music-assistant-alarm-clock-server@$DIGEST" | tee candidate/manifest.txt
          printf '%s\n' "$DIGEST" > candidate/digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alarmclock-candidate-evidence
          path: |
            candidate/digest.txt
            candidate/manifest.txt
            candidate/overlay/build.json
  boot:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    name: Boot ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DIGEST: ${{ inputs.verify_digest || needs.publish.outputs.digest }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate immutable image reference
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$DIGEST" > candidate/digest.txt
      - name: Isolated native boot
        run: python3 candidate/smoke.py "ghcr.io/dafern/music-assistant-alarm-clock-server@$DIGEST" "linux/$ARCH" > "candidate/boot-$ARCH.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alarmclock-boot-${{ matrix.arch }}
          path: |
            candidate/digest.txt
            candidate/boot-*.log
