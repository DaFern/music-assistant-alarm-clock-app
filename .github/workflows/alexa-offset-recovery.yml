name: Alexa offset recovery candidate
on:
  push:
    paths:
      - music_assistant_alarm_clock/**
      - tests/alexa_offset/**
      - .github/workflows/alexa-offset-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-amd64-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaFern/HA-Alarm-Clock
          ref: 821c78151d2d9a5250c992b57b5fb684af8ac84b
          path: alarm-project
          persist-credentials: false
      - name: Build hash-guarded recovery app
        run: docker build -t ma-alexa-recovery-check music_assistant_alarm_clock
      - name: Check installed recovery API import
        run: >-
          docker run --rm --entrypoint python ma-alexa-recovery-check -c
          'from music_assistant.controllers.player_queues.controller import PlayerQueuesController;
          assert callable(PlayerQueuesController.recover_alexa_flow);
          from music_assistant.controllers.player_queues.alexa_recovery_timeline import remember_flow;
          import inspect, music_assistant.controllers.streams.audio as audio;
          assert "remember_flow(" in inspect.getsource(audio)'
      - name: Run focused tests in the actual app runtime
        run: >-
          docker run --rm --entrypoint python -v "$PWD:/workspace:ro" -w /workspace
          ma-alexa-recovery-check -m unittest discover -s tests/alexa_offset -p 'test*.py' -v
      - name: Run alarm regression suite in actual app runtime
        run: >-
          docker run --rm --entrypoint sh
          -v "$PWD/alarm-project:/workspace:ro" -w /workspace
          ma-alexa-recovery-check -c
          "mkdir -p /data/v2/cache/opencode && python -B -m unittest discover -s tests -p 'test_*.py' -q"
      - name: Verify installed alarm commands match tested templates
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD:/workspace:ro" -w /workspace
          ma-alexa-recovery-check tests/verify_queue_modes.py
