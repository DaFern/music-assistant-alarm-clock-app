name: Portable Alexa skill candidate
on:
  push:
    paths: ['contrib/alexa-skill/**', '.github/workflows/portable-skill-candidate.yml']
  pull_request:
    paths: ['contrib/alexa-skill/**', '.github/workflows/portable-skill-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: bundle
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alams154/music-assistant-alexa-skill-prototype
          ref: 2967b60551250bcce50586e9de0f6b036dcff237
          path: skill
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply pinned candidate
        working-directory: skill
        run: |
          git apply --check ../bundle/contrib/alexa-skill/portable-search-recovery.patch
          git apply ../bundle/contrib/alexa-skill/portable-search-recovery.patch
          git apply --check ../bundle/contrib/alexa-skill/pairing-player-picker.patch
          git apply ../bundle/contrib/alexa-skill/pairing-player-picker.patch
          git diff --check
      - run: python -m pip install -r skill/app/requirements.txt
      - run: python -m compileall -q skill/app
      - run: python -m unittest discover -s skill/tests/portable -v
